<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nTecnoAz — TecnoGPT Real AI</title>
    
    <!-- Google Fonts & FontAwesome İkonları -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #090d16;
            --bg-chat: #111827;
            --bg-card: #1f293d;
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.3);
            --accent: #3b82f6;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: #374151;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header {
            background: #030712; border-bottom: 1px solid var(--border); padding: 12px 25px;
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }
        .brand-logo { font-size: 22px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }
        .brand-logo span { color: var(--primary); }

        .tiktok-owner-btn {
            background: linear-gradient(135deg, #fe2c55, #25f4ee); color: #000; font-weight: 800;
            font-size: 13px; padding: 8px 16px; border-radius: 20px; text-decoration: none;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
            box-shadow: 0 0 12px rgba(254, 44, 85, 0.4);
        }
        .tiktok-owner-btn:hover { transform: scale(1.05); }

        .avatar-bar { background: #0d1322; padding: 10px; display: flex; justify-content: center; gap: 20px; border-bottom: 1px solid var(--border); }
        .avatar-option {
            display: flex; align-items: center; gap: 8px; background: var(--bg-card); padding: 6px 14px;
            border-radius: 12px; border: 2px solid transparent; cursor: pointer; font-size: 13px; font-weight: 700; transition: 0.3s;
        }
        .avatar-option.active { border-color: var(--primary); background: var(--primary-glow); }

        .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; max-width: 900px; width: 100%; margin: 0 auto; }
        .message { display: flex; gap: 12px; max-width: 85%; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.bot { align-self: flex-start; }
        .msg-avatar { width: 38px; height: 38px; border-radius: 50%; background: #1f293d; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; border: 1px solid var(--border); }
        .msg-content { background: var(--bg-card); padding: 12px 18px; border-radius: 16px; font-size: 15px; line-height: 1.5; border: 1px solid var(--border); }
        .message.user .msg-content { background: var(--accent); color: #fff; border-color: var(--accent); border-bottom-right-radius: 2px; }
        .message.bot .msg-content { background: var(--bg-chat); border-bottom-left-radius: 2px; }

        .input-area { background: #030712; border-top: 1px solid var(--border); padding: 15px 20px; }
        .input-box-wrapper { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; background: var(--bg-chat); border: 1px solid var(--border); border-radius: 16px; padding: 8px 12px; align-items: center; }
        .input-box-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        .input-box-wrapper input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 15px; padding: 8px; }
        .send-btn { background: var(--primary); color: #000; border: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: 0.2s; }
        .send-btn:hover { transform: scale(1.05); background: #059669; color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo"><i class="fa-solid fa-robot" style="color: var(--primary);"></i> nTecno<span>Az</span></div>
        <div>
            <a href="https://www.tiktok.com/@rehimovv111" target="_blank" class="tiktok-owner-btn"><i class="fa-brands fa-tiktok"></i> Sayt sahibi</a>
        </div>
    </header>

    <div class="avatar-bar">
        <div class="avatar-option active" id="avatarPanda" onclick="selectAvatar('panda')"><span>🐼 TecnoPanda AI</span></div>
        <div class="avatar-option" id="avatarFrog" onclick="selectAvatar('frog')"><span>🐸 TecnoFrog AI</span></div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message bot">
            <div class="msg-avatar" id="botAvatarIcon">🐼</div>
            <div class="msg-content">Salam! Mən real AI ilə təchiz olunmuş <b>TecnoGPT</b>-yəm. Mənə istənilən fərqli sualı verə bilərsən! 😊</div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-box-wrapper">
            <input type="text" id="userInput" placeholder="Sualını yaz..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // 🔑 SƏNİN CANLI GROQ AI API KEY-İN:
        const GROQ_API_KEY = "Gsk_HONJnAKaLJ20qpjTci8dWGdyb3FYvlQc5BfT3tdMBbORE4LqN3wo";

        let currentAvatar = '🐼';

        function selectAvatar(type) {
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('active'));
            if(type === 'panda') {
                document.getElementById('avatarPanda').classList.add('active');
                currentAvatar = '🐼';
            } else {
                document.getElementById('avatarFrog').classList.add('active');
                currentAvatar = '🐸';
            }
            document.getElementById('botAvatarIcon').innerText = currentAvatar;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user', '👤');
            input.value = '';

            // Fikirləşir... animasiyası
            const loadingId = addMessage("Fikirləşirəm...", 'bot', currentAvatar);

            // Məcburi Xüsusi Qaydalar
            const q = text.toLowerCase();
            if (q.includes("seni kim") || q.includes("səni kim") || q.includes("qurub") || q.includes("yaradib") || q.includes("yaradıb") || q.includes("sahibin")) {
                updateMessage(loadingId, "Məni <b>Nicat Rəhimli</b> yaradıb.");
                return;
            }
            if (q.includes("hansi olke") || q.includes("hansı ölkə") || q.includes("haradansan") || q.includes("haralisan") || q.includes("hardansan")) {
                updateMessage(loadingId, "Mən <b>Azərbaycan</b> ölkəsindənmən!");
                return;
            }

            // Həqiqi Groq AI API Sorğusu (Llama 3.3 70B Model)
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { 
                                role: "system", 
                                content: "Sən TecnoGPT adında köməkçisən. Nicat Rəhimli tərəfindən yaradılmısan və Azərbaycandansan. İstifadəçilərin istənilən sualına Azərbaycan dilində çox ağıllı, dəqiq, səmimi və ətraflı cavab ver." 
                            },
                            { role: "user", content: text }
                        ]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    let aiText = data.choices[0].message.content;
                    // Format yeni sətirlər
                    aiText = aiText.replace(/\n/g, "<br>");
                    updateMessage(loadingId, aiText);
                } else {
                    updateMessage(loadingId, "Aydınlaşdırma xətası baş verdi. Yenidən cəhd edin.");
                }
            } catch (err) {
                updateMessage(loadingId, "AI Serverinə bağlanarkən xəta oldu. Şəbəkəni yoxlayın.");
            }
        }

        function addMessage(text, sender, avatarIcon) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            const id = 'msg-' + Date.now();
            msgDiv.id = id;
            msgDiv.className = `message ${sender}`;

            msgDiv.innerHTML = `
                <div class="msg-avatar">${avatarIcon}</div>
                <div class="msg-content">${text}</div>
            `;

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function updateMessage(id, newText) {
            const msgDiv = document.getElementById(id);
            if (msgDiv) {
                msgDiv.querySelector('.msg-content').innerHTML = newText;
            }
        }
    </script>
</body>
</html>
