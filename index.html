<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nTecnoAz — TecnoGPT Yapay Zeka</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #090d16;
            --bg-chat: #111827;
            --bg-card: #1f293d;
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.3);
            --accent: #3b82f6;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: #374151;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        header {
            background: #030712;
            border-bottom: 1px solid var(--border);
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo span {
            color: var(--primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .tiktok-owner-btn {
            background: linear-gradient(135deg, #fe2c55, #25f4ee);
            color: #000;
            font-weight: 800;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 0 12px rgba(254, 44, 85, 0.4);
        }

        .tiktok-owner-btn:hover {
            transform: scale(1.05);
        }

        /* Avatar Selector Bar */
        .avatar-bar {
            background: #0d1322;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
            border-bottom: 1px solid var(--border);
        }

        .avatar-option {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 6px 14px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: 0.3s;
        }

        .avatar-option.active {
            border-color: var(--primary);
            background: var(--primary-glow);
        }

        .avatar-option img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.bot {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #1f293d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .msg-content {
            background: var(--bg-card);
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            border: 1px solid var(--border);
        }

        .message.user .msg-content {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            border-bottom-right-radius: 2px;
        }

        .message.bot .msg-content {
            background: var(--bg-chat);
            border-bottom-left-radius: 2px;
        }

        /* Input Box */
        .input-area {
            background: #030712;
            border-top: 1px solid var(--border);
            padding: 15px 20px;
        }

        .input-box-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            background: var(--bg-chat);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 12px;
            align-items: center;
        }

        .input-box-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .input-box-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            padding: 8px;
        }

        .send-btn {
            background: var(--primary);
            color: #000;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            font-weight: bold;
        }

        .send-btn:hover {
            transform: scale(1.05);
            background: #059669;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand-logo">
            <i class="fa-solid fa-robot" style="color: var(--primary);"></i> nTecno<span>Az</span>
        </div>

        <div class="header-right">
            <span style="font-size: 13px; color: var(--text-muted); font-weight: 600;">TecnoGPT AI</span>
            <!-- TikTok Owner Link -->
            <a href="https://www.tiktok.com/@rehimovv111" target="_blank" class="tiktok-owner-btn">
                <i class="fa-brands fa-tiktok"></i> Sayt sahibi
            </a>
        </div>
    </header>

    <!-- Avatar Selection (Panda & Frog) -->
    <div class="avatar-bar">
        <div class="avatar-option active" id="avatarPanda" onclick="selectAvatar('panda')">
            <span>🐼 TecnoPanda AI</span>
        </div>
        <div class="avatar-option" id="avatarFrog" onclick="selectAvatar('frog')">
            <span>🐸 TecnoFrog AI</span>
        </div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-container" id="chatContainer">
        <!-- Initial Bot Welcome Message -->
        <div class="message bot">
            <div class="msg-avatar" id="botAvatarIcon">🐼</div>
            <div class="msg-content">
                Salam! Mən <b>TecnoGPT</b> ağıllı süni intellekt köməkçisiyəm. Mənə istənilən sualı verə bilərsən, sənə kömək etməkdən şad olaram! 😊
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <div class="input-box-wrapper">
            <input type="text" id="userInput" placeholder="TecnoGPT-yə bir sual ver..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        let currentAvatar = '🐼';

        function selectAvatar(type) {
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('active'));
            if(type === 'panda') {
                document.getElementById('avatarPanda').classList.add('active');
                currentAvatar = '🐼';
            } else {
                document.getElementById('avatarFrog').classList.add('active');
                currentAvatar = '🐸';
            }
            document.getElementById('botAvatarIcon').innerText = currentAvatar;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            // Render User Message
            addMessage(text, 'user', '👤');
            input.value = '';

            // AI Processing Response
            setTimeout(() => {
                const response = generateAIResponse(text);
                addMessage(response, 'bot', currentAvatar);
            }, 600);
        }

        function addMessage(text, sender, avatarIcon) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            msgDiv.innerHTML = `
                <div class="msg-avatar">${avatarIcon}</div>
                <div class="msg-content">${text}</div>
            `;

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        // Intelligently Process Questions & Special Rules
        function generateAIResponse(query) {
            const q = query.toLowerCase();

            // Special Identity Rules
            if (q.includes("seni kim") || q.includes("səni kim") || q.includes("qurub") || q.includes("yaradib") || q.includes("sahibin")) {
                return "Məni <b>Nicat Rəhimli</b> yaradıb.";
            }

            if (q.includes("hansi olke") || q.includes("hansı ölkə") || q.includes("haradansan") || q.includes("hardansan") || q.includes("haralisan")) {
                return "Mən <b>Azərbaycan</b> ölkəsindənmən!";
            }

            if (q.includes("adin ne") || q.includes("adın nə") || q.includes("kimsen") || q.includes("kimsən")) {
                return "Mənim adım <b>TecnoGPT</b>-dir. nTecnoAz brendi altında yaradılmış ağıllı yapay zeka köməkçisiyəm.";
            }

            // General Conversational Answers
            if (q.includes("salam") || q.includes("necesen") || q.includes("necəsən") || q.includes("salamlar")) {
                return "Salam! Çox sağ olun, mən əla işləyirəm. Siz necəsiniz? Sizə necə kömək edə bilərəm?";
            }

            if (q.includes("sağ ol") || q.includes("sagol") || q.includes("təşəkkür") || q.includes("tesekkur")) {
                return "Xoşdur! Hər zaman xidmətinizdəyəm. Başqa bir sualınız var?";
            }

            if (q.includes("oyun") || q.includes("game") || q.includes("fps") || q.includes("minecraft") || q.includes("pubg")) {
                return "Oyunlar və sistem optimizasiyası haqqında suallarınızı cavablandırmağa hazıram! FPS artırmaq, server sazlamaları və ya sistem tələbləri barədə nə bilmək istəyirsiniz?";
            }

            if (q.includes("kod") || q.includes("html") || q.includes("sayt") || q.includes("program")) {
                return "Mən veb proqramlaşdırma, HTML, CSS və JavaScript kodları yazmaqda çox yaxşıyam! Hansı kodu hazırlamağımı istəyirsiniz?";
            }

            // Default Smart AI Response
            return `Sualınız üçün təşəkkür edirəm! "${query}" mövzusunda sizə kömək edə bilərəm. TecnoGPT olaraq daha ətraflı məlumat almaq üçün konkret nəsə soruşa bilərsiniz! 😊`;
        }
    </script>
</body>
</html>
