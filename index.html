<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nTecnoAz — TecnoGPT Real AI Portal</title>
    
    <!-- Google Fonts & FontAwesome İkonları -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #090d16;
            --bg-chat: #111827;
            --bg-card: #1f293d;
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.35);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
        }

        header {
            background: rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo i {
            color: var(--primary);
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }

        .brand-logo span {
            background: linear-gradient(135deg, #34d399, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .gpt-badge {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .tiktok-owner-btn {
            background: linear-gradient(135deg, #fe2c55, #25f4ee);
            color: #000;
            font-weight: 800;
            font-size: 13px;
            padding: 9px 18px;
            border-radius: 24px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 0 16px rgba(254, 44, 85, 0.35);
        }

        .tiktok-owner-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 22px rgba(254, 44, 85, 0.55);
        }

        .avatar-bar {
            background: rgba(13, 19, 34, 0.8);
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 16px;
            border-bottom: 1px solid var(--border);
        }

        .avatar-option {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            padding: 8px 18px;
            border-radius: 14px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.3s ease;
            color: var(--text-muted);
        }

        .avatar-option.active {
            border-color: var(--primary);
            background: rgba(16, 185, 129, 0.15);
            color: #fff;
            box-shadow: 0 0 14px var(--primary-glow);
        }

        .chat-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 920px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 14px;
            max-width: 85%;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.bot {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .msg-content {
            background: var(--bg-card);
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            border: 1px solid var(--border);
            word-break: break-word;
        }

        .message.user .msg-content {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
            border-bottom-right-radius: 4px;
        }

        .message.bot .msg-content {
            background: var(--bg-chat);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            background: rgba(3, 7, 18, 0.95);
            border-top: 1px solid var(--border);
            padding: 18px 24px;
        }

        .input-box-wrapper {
            max-width: 920px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            background: var(--bg-chat);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 8px 14px;
            align-items: center;
        }

        .input-box-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            padding: 10px;
        }

        .send-btn {
            background: var(--primary);
            color: #030712;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <i class="fa-solid fa-brain"></i> nTecno<span>Az</span>
        </div>

        <div class="header-right">
            <span class="gpt-badge">TecnoGPT AI</span>
            <a href="https://www.tiktok.com/@rehimovv111" target="_blank" class="tiktok-owner-btn">
                <i class="fa-brands fa-tiktok"></i> Sayt sahibi
            </a>
        </div>
    </header>

    <div class="avatar-bar">
        <div class="avatar-option active" id="avatarPanda" onclick="selectAvatar('panda')">
            <span>🐼 TecnoPanda AI</span>
        </div>
        <div class="avatar-option" id="avatarFrog" onclick="selectAvatar('frog')">
            <span>🐸 TecnoFrog AI</span>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message bot">
            <div class="msg-avatar" id="botAvatarIcon">🐼</div>
            <div class="msg-content">
                Salam! Mən real AI ilə təchiz olunmuş <b>TecnoGPT</b>-yəm. Mənə istənilən sualı verə bilərsən! 😊
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-box-wrapper">
            <input type="text" id="userInput" placeholder="TecnoGPT-yə bir sual ver..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // 🔑 DÜZƏLDİLMİŞ VƏ KİÇİK gsk_ İLƏ BAŞLAYAN AKTİV API KEY:
        const GROQ_API_KEY = "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";

        let currentAvatar = '🐼';

        function selectAvatar(type) {
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('active'));
            if(type === 'panda') {
                document.getElementById('avatarPanda').classList.add('active');
                currentAvatar = '🐼';
            } else {
                document.getElementById('avatarFrog').classList.add('active');
                currentAvatar = '🐸';
            }
            document.getElementById('botAvatarIcon').innerText = currentAvatar;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user', '👤');
            input.value = '';

            const loadingId = addMessage("Fikirləşirəm...", 'bot', currentAvatar);
            const q = text.toLowerCase().trim();

            // 1. Məcburi Xüsusi Şəxsiyyət Qaydaları
            if (q.includes("seni kim") || q.includes("səni kim") || q.includes("qurub") || q.includes("yaradib") || q.includes("yaradıb") || q.includes("sahibin")) {
                setTimeout(() => updateMessage(loadingId, "Məni <b>Nicat Rəhimli</b> yaradıb."), 300);
                return;
            }

            if (q.includes("hansi olke") || q.includes("hansı ölkə") || q.includes("haradansan") || q.includes("haralisan") || q.includes("hardansan") || q.includes("ölkədənsən")) {
                setTimeout(() => updateMessage(loadingId, "Mən <b>Azərbaycan</b> ölkəsindənmən!"), 300);
                return;
            }

            // 2. Canlı Groq API Sorğusu (Llama 3.3 70B AI)
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { 
                                role: "system", 
                                content: "Sən nTecnoAz brendi üçün TecnoGPT adında ağıllı süni intellekt köməkçisisən. Nicat Rəhimli tərəfindən yaradılmısan və Azərbaycandansan. İstifadəçilərin istənilən fərqli suallarına Azərbaycan dilində tam dəqiq, ağıllı, səmimi, aydın və ətraflı cavablar ver." 
                            },
                            { role: "user", content: text }
                        ]
                    })
                });

                const data = await response.json();

                if (data.choices && data.choices[0] && data.choices[0].message) {
                    let aiText = data.choices[0].message.content;
                    aiText = aiText.replace(/\n/g, "<br>");
                    updateMessage(loadingId, aiText);
                } else {
                    updateMessage(loadingId, "Xəta baş verdi. Zəhmət olmasa bir az sonra yenidən cəhd edin.");
                }
            } catch (err) {
                updateMessage(loadingId, "AI Serverinə bağlanarkən xəta oldu. İnternet bağlantınızı yoxlayın.");
            }
        }

        function addMessage(text, sender, avatarIcon) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            const id = 'msg-' + Date.now();
            msgDiv.id = id;
            msgDiv.className = `message ${sender}`;

            msgDiv.innerHTML = `
                <div class="msg-avatar">${avatarIcon}</div>
                <div class="msg-content">${text}</div>
            `;

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function updateMessage(id, newText) {
            const msgDiv = document.getElementById(id);
            if (msgDiv) {
                msgDiv.querySelector('.msg-content').innerHTML = newText;
            }
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
