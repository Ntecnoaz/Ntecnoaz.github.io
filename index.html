<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ntecno Clicker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #12121e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none;
        }
        .card {
            background: #1e1e2f;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 1px solid #2a2a40;
        }
        h1 {
            color: #00e676;
            margin-bottom: 15px;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(0,230,118,0.3);
        }
        .score-box {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 20px 0;
            color: #ffffff;
        }
        .click-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #00e676, #00b0ff);
            color: #12121e;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 230, 118, 0.4);
            transition: transform 0.1s;
            margin-bottom: 25px;
        }
        .click-btn:active {
            transform: scale(0.92);
        }
        .shop {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .upgrade-btn {
            padding: 14px;
            font-size: 0.95rem;
            background: #28283d;
            color: #fff;
            border: 2px solid #00e676;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .upgrade-btn:disabled {
            border-color: #444;
            color: #777;
            background: #181824;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Ntecno Clicker 🚀</h1>
        <div class="score-box"><span id="score">0</span> Xal</div>
        
        <button class="click-btn" id="clickBtn">Tıqla!</button>

        <div class="shop">
            <button class="upgrade-btn" id="upgrade1">Avto-Tıqlayan (+1/san)<br>Qiymət: 10 Xal</button>
            <button class="upgrade-btn" id="upgrade2">Super Tıqlayan (+5/san)<br>Qiymət: 50 Xal</button>
        </div>
    </div>

    <script>
        let score = 0;
        let cps = 0;
        let up1Cost = 10;
        let up2Cost = 50;

        const scoreEl = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');
        const up1Btn = document.getElementById('upgrade1');
        const up2Btn = document.getElementById('upgrade2');

        clickBtn.addEventListener('click', () => {
            score++;
            updateUI();
        });

        up1Btn.addEventListener('click', () => {
            if (score >= up1Cost) {
                score -= up1Cost;
                cps += 1;
                up1Cost = Math.floor(up1Cost * 1.5);
                updateUI();
            }
        });

        up2Btn.addEventListener('click', () => {
            if (score >= up2Cost) {
                score -= up2Cost;
                cps += 5;
                up2Cost = Math.floor(up2Cost * 1.5);
                updateUI();
            }
        });

        setInterval(() => {
            score += cps;
            updateUI();
        }, 1000);

        function updateUI() {
            scoreEl.textContent = score;
            up1Btn.innerHTML = `Avto-Tıqlayan (+1/san)<br>Qiymət: ${up1Cost} Xal`;
            up2Btn.innerHTML = `Super Tıqlayan (+5/san)<br>Qiymət: ${up2Cost} Xal`;
            up1Btn.disabled = score < up1Cost;
            up2Btn.disabled = score < up2Cost;
        }
    </script>
</body>
</html>
