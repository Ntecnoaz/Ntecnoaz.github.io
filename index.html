<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nTecnoAz - Canlı Futbol & İstatistislər</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        header {
            background-color: #0b1120;
            padding: 15px 20px;
            border-bottom: 2px solid #22c55e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }
        .logo span {
            color: #22c55e;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .widget-card {
            background: #1e293b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        h2 {
            font-size: 18px;
            color: #22c55e;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">nTecno<span>Az</span></div>
        <div style="color: #94a3b8; font-size: 14px;">Canlı Futbol Mərkəzi</div>
    </header>

    <div class="container">
        <!-- Canlı Matçlar (Real-Time Live Scores) -->
        <div class="widget-card">
            <h2><i class="fa-solid fa-broadcast-tower"></i> Canlı Oyunlar Və Nəticələr</h2>
            <!-- Scoreaxis Real-time Widget -->
            <iframe id="sofascore-embed-955-42" src="https://widgets.scoreaxis.com/live-scores?font=Arial&fontSize=13&textColor=%23ffffff&backgroundColor=%231e293b" width="100%" height="550" style="border:none; border-radius:8px;"></iframe>
        </div>

        <!-- Puan Durumu (Real-time Standings) -->
        <div class="widget-card">
            <h2><i class="fa-solid fa-trophy"></i> Turnir Cədvəlləri</h2>
            <iframe src="https://widgets.scoreaxis.com/standings?font=Arial&fontSize=13&textColor=%23ffffff&backgroundColor=%231e293b" width="100%" height="450" style="border:none; border-radius:8px;"></iframe>
        </div>
    </div>

</body>
</html>
