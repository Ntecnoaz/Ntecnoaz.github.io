<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ntecno Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: #111;
            color: #fff;
            overflow: hidden;
        }
        #header {
            padding: 10px;
            background: #222;
            font-size: 20px;
            font-weight: bold;
            color: #00e676;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 400px;
            margin: 0 auto;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 500px;
            margin: 0 auto;
            border: 2px solid #00e676;
            overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }
        .mode-btn {
            padding: 5px 10px;
            font-size: 12px;
            background: #00e676;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #shop {
            max-width: 400px;
            margin: 10px auto;
            background: #222;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .skin-btn {
            padding: 8px 12px;
            font-size: 12px;
            border: 1px solid #00e676;
            background: #333;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
        }
        .skin-btn:disabled { border-color: #555; color: #777; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="header">
        <span>Ntecno Game 🐸</span>
        <button class="mode-btn" id="modeBtn" onclick="toggleMode()">🌙 Gecə</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
    </div>

    <div id="shop">
        <button class="skin-btn" onclick="buySkin('green', 0)">🟢 Yaşıl (0)</button>
        <button class="skin-btn" id="skin-silver" onclick="buySkin('silver', 15)">🥈 Gümüş (15)</button>
        <button class="skin-btn" id="skin-gold" onclick="buySkin('gold', 40)">🥇 Gold (40)</button>
        <button class="skin-btn" id="skin-rainbow" onclick="buySkin('rainbow', 100)">🌈 Göyqurşağı (100)</button>
        <button class="skin-btn" id="skin-lava" onclick="buySkin('lava', 1000)">🌋 Lava (1000)</button>
    </div>
