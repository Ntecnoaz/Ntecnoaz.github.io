<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azərbaycan Rayonları - Xal Vermə və Reytinq</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(90deg, #1e293b, #0f172a);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #38bdf8;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        header h1 {
            color: #38bdf8;
            font-size: 24px;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        /* Xəritə Bölməsi */
        .map-section {
            flex: 2;
            min-width: 320px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .map-title {
            margin-bottom: 15px;
            color: #94a3b8;
            font-size: 14px;
        }

        .svg-map {
            width: 100%;
            height: auto;
            max-height: 550px;
            filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.5));
        }

        /* Xəritədəki Rayonlar */
        .district {
            fill: #334155;
            stroke: #0f172a;
            stroke-width: 1.5;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .district:hover {
            fill: #38bdf8;
            stroke: #fff;
            stroke-width: 2;
            filter: brightness(1.2);
        }

        .district-label {
            fill: #ffffff;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
            text-anchor: middle;
            user-select: none;
        }

        /* Bildiriş Mesajı */
        .alert-box {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #22c55e;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            font-weight: bold;
            z-index: 1000;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Yan Panel: Reytinq və Reklam */
        .sidebar {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Reytinq Cədvəli */
        .leaderboard-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .leaderboard-card h2 {
            font-size: 18px;
            color: #f1f5f9;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
