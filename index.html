<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nTecnoAz — TecnoGPT Yapay Zeka</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #090d16;
            --bg-chat: #111827;
            --bg-card: #1f293d;
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.3);
            --accent: #3b82f6;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: #374151;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: #030712;
            border-bottom: 1px solid var(--border);
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo span {
            color: var(--primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .tiktok-owner-btn {
            background: linear-gradient(135deg, #fe2c55, #25f4ee);
            color: #000;
            font-weight: 800;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 0 12px rgba(254, 44, 85, 0.4);
        }

        .tiktok-owner-btn:hover {
            transform: scale(1.05);
        }

        .avatar-bar {
            background: #0d1322;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
            border-bottom: 1px solid var(--border);
        }

        .avatar-option {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 6px 14px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: 0.3s;
        }

        .avatar-option.active {
            border-color: var(--primary);
            background: var(--primary-glow);
        }

        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.bot {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #1f293d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .msg-content {
            background: var(--bg-card);
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            border: 1px solid var(--border);
        }

        .message.user .msg-content {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            border-bottom-right-radius: 2px;
        }

        .message.bot .msg-content {
            background: var(--bg-chat);
            border-bottom-left-radius: 2px;
        }

        .input-area {
            background: #030712;
            border-top: 1px solid var(--border);
            padding: 15px 20px;
        }

        .input-box-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            background: var(--bg-chat);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 12px;
            align-items: center;
        }

        .input-box-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .input-box-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            padding: 8px;
        }

        .send-btn {
            background: var(--primary);
            color: #000;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            font-weight: bold;
        }

        .send-btn:hover {
            transform: scale(1.05);
            background: #059669;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <i class="fa-solid fa-robot" style="color: var(--primary);"></i> nTecno<span>Az</span>
        </div>

        <div class="header-right">
            <span style="font-size: 13px; color: var(--text-muted); font-weight: 600;">TecnoGPT AI</span>
            <a href="https://www.tiktok.com/@rehimovv111" target="_blank" class="tiktok-owner-btn">
                <i class="fa-brands fa-tiktok"></i> Sayt sahibi
            </a>
        </div>
    </header>

    <div class="avatar-bar">
        <div class="avatar-option active" id="avatarPanda" onclick="selectAvatar('panda')">
            <span>🐼 TecnoPanda AI</span>
        </div>
        <div class="avatar-option" id="avatarFrog" onclick="selectAvatar('frog')">
            <span>🐸 TecnoFrog AI</span>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message bot">
            <div class="msg-avatar" id="botAvatarIcon">🐼</div>
            <div class="msg-content">
                Salam! Mən <b>TecnoGPT</b> süni intellekt köməkçisiyəm. Nə soruşmaq istəyirsənsə yaz, sənə canlı cavab verim! 😊
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-box-wrapper">
            <input type="text" id="userInput" placeholder="TecnoGPT-yə mesaj yaz..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        let currentAvatar = '🐼';

        function selectAvatar(type) {
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('active'));
            if(type === 'panda') {
                document.getElementById('avatarPanda').classList.add('active');
                currentAvatar = '🐼';
            } else {
                document.getElementById('avatarFrog').classList.add('active');
                currentAvatar = '🐸';
            }
            document.getElementById('botAvatarIcon').innerText = currentAvatar;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user', '👤');
            input.value = '';

            setTimeout(() => {
                const response = generateAIResponse(text);
                addMessage(response, 'bot', currentAvatar);
            }, 400);
        }

        function addMessage(text, sender, avatarIcon) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            msgDiv.innerHTML = `
                <div class="msg-avatar">${avatarIcon}</div>
                <div class="msg-content">${text}</div>
            `;

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        // Genişləndirilmiş Ağıllı Çat Alqoritmi
        function generateAIResponse(query) {
            const q = query.toLowerCase().trim();

            // Məcburi Xüsusi Qaydalar
            if (q.includes("seni kim") || q.includes("səni kim") || q.includes("qurub") || q.includes("yaradib") || q.includes("yaradıb") || q.includes("sahibin")) {
                return "Məni <b>Nicat Rəhimli</b> yaradıb.";
            }

            if (q.includes("hansi olke") || q.includes("hansı ölkə") || q.includes("haradansan") || q.includes("hardansan") || q.includes("haralisan") || q.includes("ölkədənsən")) {
                return "Mən <b>Azərbaycan</b> ölkəsindənmən!";
            }

            if (q.includes("adin ne") || q.includes("adın nə") || q.includes("kimsen") || q.includes("kimsən")) {
                return "Mənim adım <b>TecnoGPT</b>-dir. nTecnoAz brendi üçün yaradılmış süni intellektəm.";
            }

            // Kömək Və Danışıq Istəkləri
            if (q.includes("komek") || q.includes("kömək") || q.includes("ne ede bilersen") || q.includes("nə edə bilərsən")) {
                return "Sənə hər mövzuda kömək edə bilərəm! Məsələn: oyunlar, kompyuter formatı və FPS artırma, proqramlaşdırma, kod yazmaq və ya sadəcə maraqlı sohbet etmək! Nə lazımdırsa soruş.";
            }

            if (q.includes("yaxsi") || q.includes("yaxşı") || q.includes("ok") || q.includes("oldu") || q.includes("super") || q.includes("ela") || q.includes("əla")) {
                const polite = [
                    "Əla! Başqa nə bilmək istəyirsən?",
                    "Çox gözəl! Növbəti sualını gözləyirəm 😊",
                    "Həmişə xidmətindəyəm! Sualın varsa buyur yaz.",
                    "Əla, başqa necə kömək edə bilərəm?"
                ];
                return polite[Math.floor(Math.random() * polite.length)];
            }

            if (q.includes("salam") || q.includes("slm") || q.includes("salamlar")) {
                return "Salam! Xoş gəldiniz. Bu gün sənə necə kömək edə bilərəm?";
            }

            if (q.includes("necesen") || q.includes("necəsən") || q.includes("ne var ne yox") || q.includes("keyf")) {
                return "Çox sağ ol, mən əlayam! Sən necəsən? Günün necə keçir?";
            }

            if (q.includes("sagol") || q.includes("sağol") || q.includes("tesekkur") || q.includes("təşəkkür")) {
                return "Buyurun, xoşdur! İstədiyin vaxt yenidən yaza bilərsən! 😇";
            }

            if (q.includes("ne edirsen") || q.includes("nə edirsən")) {
                return "Sənin suallarını gözləyirəm və kömək etməyə hazıram! Sən nə edirsən?";
            }

            // Təsadüfi Zəngin Cavab Generasiyası (Hər dəfə eyni təkrar olmasın deyə)
            const randomAnswers = [
                `Anladım! "${query}" mövzusunda daha dəqiq nə öyrənmək istəyirsən? Ətraflı yaz, sənə kömək edim!`,
                `Maraqlıdır! Bu haqda sənə böyük məmnuniyyətlə kömək edərəm. Konkret nəyi bilmək istəyirsən?`,
                `Əla sualdır! Bu mövzuda nəyi izah etməyimi istəyirsən?`,
                `Səni dinləyirəm! Fikrini bir az da açıq yazsan, tam dəqiq cavab verərəm.`
            ];

            return randomAnswers[Math.floor(Math.random() * randomAnswers.length)];
        }
    </script>
</body>
</html>
