<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nTecnoAz — Ultimate Cyber Ecosystem</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #030712;
            --bg-card: rgba(17, 24, 39, 0.75);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --accent: #10b981;
            --purple: #8b5cf6;
            --gold: #f59e0b;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
        }

        /* Header Navigation */
        header {
            position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(16px);
            background: rgba(3, 7, 18, 0.85);
            border-bottom: 1px solid var(--border);
            padding: 15px 4%;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
        }

        .brand {
            font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px;
        }
        .brand i { color: var(--primary); filter: drop-shadow(0 0 8px var(--primary)); }
        .brand span { background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        .nav-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
            color: var(--text-muted); padding: 8px 16px; border-radius: 12px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; gap: 6px;
        }
        .nav-btn.active, .nav-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }

        .lang-container {
            display: flex; align-items: center; gap: 6px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 20px;
        }
        select { background: transparent; border: none; color: #fff; font-weight: 600; font-size: 13px; outline: none; cursor: pointer; }
        select option { background: #111827; }

        /* Container Sections */
        .section-block { display: none; max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .section-block.active { display: block; }

        /* SECTION 1: MOVIES & ANIMES */
        .search-box {
            position: relative; max-width: 700px; margin: 0 auto 30px;
        }
        .search-box input {
            width: 100%; padding: 16px 20px 16px 50px; border-radius: 16px;
            background: var(--bg-card); border: 1px solid var(--border);
            color: #fff; font-size: 16px; outline: none; transition: 0.3s;
        }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
        .search-box i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .movie-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;
        }
        .movie-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
            overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between;
        }
        .movie-card:hover { transform: translateY(-6px); border-color: var(--primary); }
        .movie-poster { width: 100%; height: 310px; object-fit: cover; background: #1f293d; }
        .movie-info { padding: 15px; }
        .movie-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
        .movie-rating { color: var(--gold); font-weight: bold; }
        .btn-group { display: flex; gap: 6px; }
        .btn-watch {
            flex: 1; padding: 8px; border-radius: 8px; border: none; font-size: 11px; font-weight: 700;
            cursor: pointer; text-align: center; transition: 0.2s;
        }
        .btn-trailer { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid var(--primary-glow); }
        .btn-trailer:hover { background: var(--primary); color: #fff; }
        .btn-full { background: var(--accent); color: #fff; }
        .btn-full:hover { opacity: 0.9; }

        /* SECTION 2: SOUNDBOARD */
        .sound-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .sound-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
            text-align: center; transition: 0.3s; cursor: pointer;
        }
        .sound-card:hover { border-color: var(--purple); box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }
        .sound-icon { font-size: 32px; color: var(--purple); margin-bottom: 10px; }
        .sound-btn { background: var(--purple); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 12px; margin-top: 10px; cursor: pointer; }

        /* SECTION 3: CYBER CAR */
        .car-dashboard {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 30px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center;
        }
        @media(max-width: 800px) { .car-dashboard { grid-template-columns: 1fr; } }
        .speedometer {
            width: 200px; height: 200px; border-radius: 50%; border: 8px solid var(--border);
            border-top-color: var(--accent); margin: 0 auto; display: flex; flex-direction: column;
            justify-content: center; align-items: center; background: rgba(0,0,0,0.5);
        }
        .speed-val { font-size: 48px; font-weight: 800; color: var(--accent); font-family: 'JetBrains Mono', monospace; }

        /* SECTION 4: SQUAD BUILDER */
        .pitch {
            background: linear-gradient(180deg, #15803d, #166534); border: 3px solid #fff; border-radius: 16px;
            height: 520px; position: relative; max-width: 750px; margin: 0 auto; padding: 20px;
        }
        .player-spot {
            position: absolute; transform: translate(-50%, -50%); text-align: center;
        }
        .player-card-box {
            background: rgba(0,0,0,0.75); border: 1px solid var(--gold); border-radius: 8px;
            padding: 4px 8px; color: #fff; width: 90px;
        }
        .player-pos { font-size: 10px; color: var(--gold); font-weight: bold; }
        .player-input { width: 100%; background: transparent; border: none; color: #fff; text-align: center; font-size: 11px; font-weight: bold; outline: none; }

        /* Modal for Videos */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; display: none; justify-content: center; align-items: center;
        }
        .modal-content { width: 90%; max-width: 850px; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative; }
        .close-modal { position: absolute; top: 10px; right: 15px; color: #fff; font-size: 24px; cursor: pointer; z-index: 10; }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="brand">
            <i class="fa-solid fa-bolt"></i> nTecno<span>Az</span>
        </div>

        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchTab('tabMovies', this)"><i class="fa-solid fa-film"></i> <span id="mTabMovies">Movies & Anime</span></button>
            <button class="nav-btn" onclick="switchTab('tabSound', this)"><i class="fa-solid fa-music"></i> <span id="mTabSound">Soundboard</span></button>
            <button class="nav-btn" onclick="switchTab('tabCar', this)"><i class="fa-solid fa-gauge-high"></i> <span id="mTabCar">Cyber Car</span></button>
            <button class="nav-btn" onclick="switchTab('tabSquad', this)"><i class="fa-solid fa-futbol"></i> <span id="mTabSquad">Squad Builder</span></button>
        </div>

        <div class="lang-container">
            <i class="fa-solid fa-globe"></i>
            <select id="langSelect" onchange="changeLang(this.value)">
                <option value="en" selected>English</option>
                <option value="az">Azərbaycan</option>
                <option value="tr">Türkçe</option>
                <option value="ru">Русский</option>
            </select>
        </div>
    </header>

    <!-- SECTION 1: MOVIE & ANIME HUB -->
    <div class="section-block active" id="tabMovies">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="movieSearch" placeholder="Search Harry Potter, Anime, or Movies..." onkeyup="searchMovies()">
        </div>
        <div class="movie-grid" id="movieGrid">
            <!-- Dynamic Movies loaded via TMDb API -->
        </div>
    </div>

    <!-- SECTION 2: SOUNDBOARD & MEME EFFECTS -->
    <div class="section-block" id="tabSound">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="soundSearch" placeholder="Search sounds..." onkeyup="filterSounds()">
        </div>
        <div class="sound-grid" id="soundGrid">
            <div class="sound-card" onclick="playSound(880)">
                <div class="sound-icon"><i class="fa-solid fa-bolt"></i></div>
                <h4 class="s-name">Cyber Pulse</h4>
                <button class="sound-btn"><i class="fa-solid fa-play"></i> Play</button>
            </div>
            <div class="sound-card" onclick="playSound(440)">
                <div class="sound-icon"><i class="fa-solid fa-bullhorn"></i></div>
                <h4 class="s-name">Bass Drop</h4>
                <button class="sound-btn"><i class="fa-solid fa-play"></i> Play</button>
            </div>
            <div class="sound-card" onclick="playSound(1200)">
                <div class="sound-icon"><i class="fa-solid fa-gamepad"></i></div>
                <h4 class="s-name">8-Bit Laser</h4>
                <button class="sound-btn"><i class="fa-solid fa-play"></i> Play</button>
            </div>
            <div class="sound-card" onclick="playSound(300)">
                <div class="sound-icon"><i class="fa-solid fa-ghost"></i></div>
                <h4 class="s-name">Meme Horn</h4>
                <button class="sound-btn"><i class="fa-solid fa-play"></i> Play</button>
            </div>
        </div>
    </div>

    <!-- SECTION 3: CYBER CAR DASHBOARD -->
    <div class="section-block" id="tabCar">
        <div class="car-dashboard">
            <div>
                <h2 style="margin-bottom: 15px;" id="carHead">⚡ 0-100 km/h Speed Estimator</h2>
                <div style="margin-bottom: 15px;">
                    <label>Horsepower (HP):</label>
                    <input type="number" id="hpInput" value="450" style="width: 100%; padding: 10px; background: #1f293d; border: 1px solid var(--border); color: #fff; border-radius: 8px; margin-top: 5px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label>Weight (KG):</label>
                    <input type="number" id="weightInput" value="1500" style="width: 100%; padding: 10px; background: #1f293d; border: 1px solid var(--border); color: #fff; border-radius: 8px; margin-top: 5px;">
                </div>
                <button onclick="calcSpeed()" style="background: var(--accent); color: #fff; padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%;">Calculate Speed</button>
            </div>
            <div class="speedometer">
                <div class="speed-val" id="accVal">3.6s</div>
                <div style="font-size: 12px; color: var(--text-muted);">0-100 KM/H</div>
            </div>
        </div>
    </div>

    <!-- SECTION 4: SQUAD BUILDER -->
    <div class="section-block" id="tabSquad">
        <h2 style="text-align: center; margin-bottom: 20px;" id="squadHead">🏆 Dream 11 Football Tactics</h2>
        <div class="pitch">
            <!-- GK -->
            <div class="player-spot" style="bottom: 5%; left: 50%;"><div class="player-card-box"><div class="player-pos">GK</div><input class="player-input" value="Courtois"></div></div>
            <!-- DEF -->
            <div class="player-spot" style="bottom: 25%; left: 20%;"><div class="player-card-box"><div class="player-pos">LB</div><input class="player-input" value="Davies"></div></div>
            <div class="player-spot" style="bottom: 22%; left: 40%;"><div class="player-card-box"><div class="player-pos">CB</div><input class="player-input" value="Van Dijk"></div></div>
            <div class="player-spot" style="bottom: 22%; left: 60%;"><div class="player-card-box"><div class="player-pos">CB</div><input class="player-input" value="Rüdiger"></div></div>
            <div class="player-spot" style="bottom: 25%; left: 80%;"><div class="player-card-box"><div class="player-pos">RB</div><input class="player-input" value="Walker"></div></div>
            <!-- MID -->
            <div class="player-spot" style="top: 48%; left: 30%;"><div class="player-card-box"><div class="player-pos">CM</div><input class="player-input" value="De Bruyne"></div></div>
            <div class="player-spot" style="top: 52%; left: 50%;"><div class="player-card-box"><div class="player-pos">CDM</div><input class="player-input" value="Rodri"></div></div>
            <div class="player-spot" style="top: 48%; left: 70%;"><div class="player-card-box"><div class="player-pos">CM</div><input class="player-input" value="Bellingham"></div></div>
            <!-- ATTACK -->
            <div class="player-spot" style="top: 18%; left: 22%;"><div class="player-card-box"><div class="player-pos">LW</div><input class="player-input" value="Vinicius"></div></div>
            <div class="player-spot" style="top: 12%; left: 50%;"><div class="player-card-box"><div class="player-pos">ST</div><input class="player-input" value="Mbappé"></div></div>
            <div class="player-spot" style="top: 18%; left: 78%;"><div class="player-card-box"><div class="player-pos">RW</div><input class="player-input" value="Salah"></div></div>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <iframe id="videoIframe" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = "3fd2be6f0c70a2a598f084dd23028236"; // TMDb API Key for movies

        // Navigation Tabs
        function switchTab(tabId, btn) {
            document.querySelectorAll('.section-block').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Fetch Movies from TMDb API
        async function fetchMovies(query = 'Harry Potter') {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Loading movies...</p>';
            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                grid.innerHTML = '';

                if (!data.results || data.results.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No movies found.</p>';
                    return;
                }

                data.results.forEach(m => {
                    const poster = m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Poster';
                    grid.innerHTML += `
                        <div class="movie-card">
                            <img class="movie-poster" src="${poster}" alt="${m.title}">
                            <div class="movie-info">
                                <div class="movie-title">${m.title}</div>
                                <div class="movie-meta">
                                    <span>${m.release_date ? m.release_date.split('-')[0] : 'N/A'}</span>
                                    <span class="movie-rating">★ ${m.vote_average ? m.vote_average.toFixed(1) : 'N/A'}</span>
                                </div>
                                <div class="btn-group">
                                    <button class="btn-watch btn-trailer" onclick="playTrailer(${m.id})">Trailer</button>
                                    <button class="btn-watch btn-full" onclick="playFullMovie('${m.title}')">Watch Full</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Error loading database.</p>';
            }
        }

        let searchTimeout;
        function searchMovies() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                let q = document.getElementById('movieSearch').value;
                fetchMovies(q || 'Harry Potter');
            }, 500);
        }

        // Play YouTube Trailer
        async function playTrailer(movieId) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${movieId}/videos?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                const trailer = data.results.find(v => v.type === 'Trailer' && v.site === 'YouTube') || data.results[0];
                if (trailer) {
                    document.getElementById('videoIframe').src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1`;
                    document.getElementById('videoModal').style.display = 'flex';
                } else {
                    alert('Trailer not available for this movie.');
                }
            } catch (e) { alert('Unable to load video.'); }
        }

        // Play Full Movie Stream
        function playFullMovie(title) {
            document.getElementById('videoIframe').src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(title + ' full movie')}&autoplay=1`;
            document.getElementById('videoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('videoIframe').src = '';
        }

        // Web Audio Synthesizer Sound Player
        function playSound(freq) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
            setTimeout(() => osc.stop(), 500);
        }

        // Speed Calculator
        function calcSpeed() {
            let hp = parseFloat(document.getElementById('hpInput').value) || 1;
            let weight = parseFloat(document.getElementById('weightInput').value) || 1;
            let sec = ((weight / hp) * 1.1).toFixed(1);
            document.getElementById('accVal').innerText = sec + 's';
        }

        // Multi-Language Support
        const langData = {
            en: { mTabMovies: "Movies & Anime", mTabSound: "Soundboard", mTabCar: "Cyber Car", mTabSquad: "Squad Builder", carHead: "⚡ 0-100 km/h Speed Estimator", squadHead: "🏆 Dream 11 Football Tactics" },
            az: { mTabMovies: "Kino və Anime", mTabSound: "Səs Bazası", mTabCar: "Kiber Maşın", mTabSquad: "Taktik Heyət", carHead: "⚡ 0-100 km/s Sürət Hesablayıcı", squadHead: "🏆 Xəyali 11 Futbol Taktikası" },
            tr: { mTabMovies: "Film ve Anime", mTabSound: "Ses Paneli", mTabCar: "Siber Araba", mTabSquad: "Kadro Kurucu", carHead: "⚡ 0-100 km/s Hız Hesaplayıcı", squadHead: "🏆 Rüya 11 Futbol Taktikleri" },
            ru: { mTabMovies: "Фильмы и Аниме", mTabSound: "Звуковая Панель", mTabCar: "Кибер Авто", mTabSquad: "Состав Команды", carHead: "⚡ 0-100 км/ч Калькулятор Скорости", squadHead: "🏆 Мечта 11 Футбольная Тактика" }
        };

        function changeLang(lang) {
            const d = langData[lang];
            for (let key in d) {
                if (document.getElementById(key)) document.getElementById(key).innerText = d[key];
            }
        }

        // Initial Load
        window.onload = () => { fetchMovies('Harry Potter'); };
    </script>
</body>
</html>
