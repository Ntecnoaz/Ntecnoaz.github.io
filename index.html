<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ntecno Game 🐸</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 15px;
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Gündüz Modu */
        body.day-mode {
            background-color: #e0e0e0;
            color: #111111;
        }

        /* Üst Panel */
        .top-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00e676;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-btn {
            background: #00e676;
            color: #121212;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
            transition: transform 0.1s;
        }

        .theme-btn:active {
            transform: scale(0.95);
        }

        /* Oyun/Kətan Ərazisi (Canvas Area) */
        .game-container {
            width: 100%;
            max-width: 500px;
            height: 55vh;
            background-color: #2b2b36;
            border: 3px solid #00e676;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body.day-mode .game-container {
            background-color: #ffffff;
        }

        canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Alt Düymələr / Mağaza Paneli */
        .controls-panel {
            width: 100%;
            max-width: 500px;
            background: #2b2b36;
            border: 1px solid #3d3d4e;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        body.day-mode .controls-panel {
            background: #ffffff;
            border-color: #ccc;
        }

        .color-btn {
            background: #1a1a24;
            border: 2px solid #00e676;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.1s, background-color 0.2s;
            flex: 1 1 40%;
            max-width: 48%;
            justify-content: center;
        }

        body.day-mode .color-btn {
            background: #f0f0f0;
            color: #111;
        }

        .color-btn:active {
            transform: scale(0.95);
        }

        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }

        .green-dot { background: #00e676; }
        .silver-dot { background: #c0c0c0; }
        .gold-dot { background: #ffd700; }
        .rainbow-dot { background: linear-gradient(45deg, red, yellow, green, cyan, blue, violet); }
        .lava-dot { background: linear-gradient(45deg, #ff4500, #ff8c00); }

        .score-info {
            width: 100%;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #00e676;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <!-- Üst Panel -->
    <div class="top-bar">
        <div class="title">Ntecno Game
